name: Build & Deploy Cockpit v12

on:
  schedule:
    # Every 30 minutes during A-share trading hours (9:00-15:30 CST, UTC 1:00-7:30, Mon-Fri)
    - cron: '*/30 1-7 * * 1-5'
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build cockpit
        run: python build_gh_pages.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false
