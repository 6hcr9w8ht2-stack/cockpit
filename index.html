<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cockpit</title>
<style>body{font-family:system-ui;background:#0b0e14;color:#8b949e;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}#s{font-size:14px}</style>
</head><body><div id="s">loading cockpit…</div>
<script>
(async()=>{
 try{
  const r=await fetch('index.html.gz',{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const buf=await r.arrayBuffer();
  const ds=new DecompressionStream('gzip');
  const txt=await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
  document.open();document.write(txt);document.close();
 }catch(e){
  document.getElementById('s').textContent='load failed: '+e.message+' — refresh to retry';
 }
})();
</script></body></html>
